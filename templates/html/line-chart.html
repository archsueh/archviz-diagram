    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--av-surface);
        color: var(--av-text-primary);
        margin: 0;
        padding: 20px;
      }
      .chart-container {
        max-width: 800px;
        margin: 0 auto;
      }
      /* 图表是内联 SVG 而非 canvas —— 导出走矢量路径，主题切换靠 CSS 变量自动生效。
         颜色必须走 CSS 类而不是 fill="var(--x)"：var() 在 SVG 表现属性里跨浏览器行为
         不一致，写在样式规则里才可靠。 */
      .chart-container > svg {
        display: block;
        background: var(--av-surface-raised);
        border: 1px solid var(--av-border);
        border-radius: 4px;
      }
      .chart-container .lc-grid {
        stroke: var(--av-border);
        stroke-width: 1;
      }
      .chart-container .lc-axis {
        stroke: var(--av-text-secondary);
        stroke-width: 1;
      }
      .chart-container .lc-area {
        fill: var(--av-accent-soft);
      }
      .chart-container .lc-line {
        fill: none;
        stroke: var(--av-chart-1);
        stroke-width: 2;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .chart-container .lc-dot {
        fill: var(--av-chart-1);
      }
      .chart-container .lc-tick {
        font:
          12px system-ui,
          -apple-system,
          sans-serif;
        fill: var(--av-text-secondary);
        text-anchor: middle;
      }
      .chart-container .lc-name {
        font:
          13px system-ui,
          -apple-system,
          sans-serif;
        fill: var(--av-text-primary);
        text-anchor: end;

        font-size: 12px;
        color: var(--av-text-tertiary);
        margin-top: 10px;

    <script>
      /* archviz-skills Theme System
       * API:
       *   applyPalette(name)  — set palette by name
       *   toggleTheme()        — toggle light↔dark
       *   getCurrentPalette()  — return current palette name
       *   isDark()             — boolean
       *   ARCHVIZ_PALETTES     — palette registry
       */
      (function () {
        "use strict";

        const PALETTES = {
          "warm-paper": { label: "Warm Paper", mode: "light" },
          "swiss-neutral": { label: "Swiss Neutral", mode: "light" },
          "editorial-parchment": { label: "Editorial", mode: "light" },
          "swiss-modernist": { label: "Swiss Modernist", mode: "light" },
          "vignelli-canon": { label: "Vignelli Canon", mode: "light" },
          "still-paper": { label: "Still Paper", mode: "light" },
          "signal-proof": { label: "Signal Proof", mode: "light" },
          "bridge-canvas": { label: "Bridge Canvas", mode: "dark" },
          "ikb-dark": { label: "IKB Dark", mode: "dark" },
          "auto-time": { label: "Auto (Time)", mode: "auto" },
        };

        // Expose globally for export module
        window.ARCHVIZ_PALETTES = PALETTES;

        let currentPalette = "warm-paper";

        function applyPalette(name) {
          if (!PALETTES[name]) return;
          currentPalette = name;
          const root = document.documentElement;
          let resolvedPalette = name;
          let activeMode = PALETTES[name].mode;

          if (name === "auto-time") {
            const hours = new Date().getHours();
            const isDaytime = hours >= 6 && hours < 18;
            resolvedPalette = isDaytime ? "still-paper" : "ikb-dark";
            activeMode = isDaytime ? "light" : "dark";
            root.setAttribute("data-palette-selection", "auto-time");
          } else {
            root.removeAttribute("data-palette-selection");
          }

          root.setAttribute("data-palette", resolvedPalette);
          root.setAttribute("data-theme", activeMode);
          localStorage.setItem("archviz-palette", name);
          updateToggleLabel();
          window.dispatchEvent(new Event("archviz-theme-changed"));
        }

        function toggleTheme() {
          const order = [
            "warm-paper",
            "swiss-neutral",
            "editorial-parchment",
            "swiss-modernist",
            "vignelli-canon",
            "still-paper",
            "signal-proof",
            "bridge-canvas",
            "ikb-dark",
            "auto-time",
          ];
          const idx = order.indexOf(currentPalette);
          applyPalette(order[(idx + 1) % order.length]);
        }

        function getCurrentPalette() {
          return currentPalette;
        }
        function isDark() {
          if (currentPalette === "auto-time") {
            const hours = new Date().getHours();
            return !(hours >= 6 && hours < 18);
          }
          return PALETTES[currentPalette]?.mode === "dark";
        }

        function updateToggleLabel() {
          const btn = document.getElementById("archviz-theme-toggle");
          if (btn)
            btn.textContent = PALETTES[currentPalette]?.label || currentPalette;
        }

        // Auto-init on DOMContentLoaded
        function init() {
          // Restore saved palette
          const saved = localStorage.getItem("archviz-palette");
          if (saved && PALETTES[saved]) {
            applyPalette(saved);
          } else {
            applyPalette("auto-time");
          }

          // Create toggle button
          const btn = document.createElement("button");
          btn.id = "archviz-theme-toggle";
          btn.textContent = PALETTES[currentPalette]?.label || "Theme";
          btn.addEventListener("click", toggleTheme);
          document.body.appendChild(btn);

          // Periodically update theme if auto-time
          setInterval(function () {
            if (currentPalette === "auto-time") {
              const hours = new Date().getHours();
              const isDaytime = hours >= 6 && hours < 18;
              const resolvedPalette = isDaytime ? "still-paper" : "ikb-dark";
              const root = document.documentElement;
              if (root.getAttribute("data-palette") !== resolvedPalette) {
                applyPalette("auto-time");
              }
            }
          }, 60000);
        }

        // Expose API
        window.archvizTheme = {
          applyPalette,
          toggleTheme,
          getCurrentPalette,
          isDark,
          init,
        };

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>

        transform: scale(1);
        pointer-events: auto;
      }
      #archviz-export-menu button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 8px 16px;
        border: none;
        background: none;
        font:
          13px/1.4 system-ui,
          -apple-system,
          sans-serif;
        color: var(--av-text-primary, #1b365d);
        cursor: pointer;
        transition:
          background 150ms ease-out,
          transform 100ms ease-out;
      }
      #archviz-export-menu button:active {
        transform: scale(0.98);
      }
      @media (hover: hover) and (pointer: fine) {
        #archviz-export-menu button:hover {
          background: var(--av-accent-soft, rgba(0, 47, 167, 0.08));
        }
      }
      #archviz-export-menu .sep {
        height: 1px;
        background: var(--av-border, #d6d3d1);
        margin: 4px 0;
      }
      #archviz-export-menu .shortcut {
        float: right;
        color: var(--av-text-tertiary, #87867f);
        font-size: 11px;
      }
      #archviz-export-toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(8px);
        z-index: 10001;
        background: var(--av-surface-raised, #faf9f5);
        border: 1px solid var(--av-border, #d6d3d1);
        border-radius: 8px;
        padding: 10px 20px;
        font:
          13px/1 system-ui,
          -apple-system,
          sans-serif;
        color: var(--av-text-primary, #1b365d);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);

        opacity: 0;
        transition:
          opacity 200ms cubic-bezier(0.16, 1, 0.3, 1),
          transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none;
      }
      #archviz-export-toast.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
        pointer-events: auto;
      }
    </style>

    <script>
      /* archviz-skills Export System
       * Keyboard: T = cycle theme, E = toggle export menu
       * API:
       *   exportPNG(selector, scale)   — 4× raster PNG download
       *   exportSVG(selector)          — dual-theme SVG download
       *   exportWebP(selector, scale)  — 4× WebP download
       *   copyToClipboard(selector)    — clipboard PNG
       */
      (function () {
        "use strict";

        const SCALE_DEFAULT = 4;

        // --- Toast ---
        function toast(msg) {
          let el = document.getElementById("archviz-export-toast");
          if (!el) {
            el = document.createElement("div");
            el.id = "archviz-export-toast";
            document.body.appendChild(el);
          }
          el.textContent = msg;
          // Force a layout reflow to ensure the transition triggers
          el.getBoundingClientRect();
          el.classList.add("visible");
          clearTimeout(el._t);
          el._t = setTimeout(() => el.classList.remove("visible"), 2200);
        }

        // --- Find export target (first SVG, or first canvas, or .archviz-export-target) ---
        function findTarget(selector) {
          if (selector) return document.querySelector(selector);
          return (
            document.querySelector(".archviz-export-target") ||
            document.querySelector("svg") ||
            document.querySelector("canvas") ||
            document.querySelector("article, .card, .canvas")
          );
        }

        // --- SVG → PNG at N× via native rasterization ---
        function svgToBlob(svgEl, scale, format) {
          return new Promise((resolve, reject) => {
            const vb = svgEl.viewBox?.baseVal;
            const w = vb?.width || svgEl.clientWidth || 800;
            const h = vb?.height || svgEl.clientHeight || 600;
            const clone = svgEl.cloneNode(true);

            // Inject current CSS vars into clone
            const computed = getComputedStyle(document.documentElement);
            const vars = [
              "--av-surface",
              "--av-surface-alt",
              "--av-text-primary",
              "--av-text-secondary",
              "--av-text-tertiary",
              "--av-border",
              "--av-accent",
              "--av-chart-1",
              "--av-chart-2",
              "--av-chart-3",
              "--av-chart-4",
              "--av-chart-5",
              "--av-chart-6",
            ];
            let varCSS = ":root{";
            vars.forEach((v) => {
              varCSS += v + ":" + computed.getPropertyValue(v).trim() + ";";
            });
            varCSS += "}";

            // Insert var overrides
            let styleEl = clone.querySelector("style");
            if (!styleEl) {
              styleEl = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "style",
              );
              clone.insertBefore(styleEl, clone.firstChild);
            }
            styleEl.textContent = varCSS + styleEl.textContent;

            clone.setAttribute("width", w * scale);
            clone.setAttribute("height", h * scale);
            if (!clone.getAttribute("viewBox")) {
              clone.setAttribute("viewBox", `0 0 ${w} ${h}`);
            }

            const svgStr = new XMLSerializer().serializeToString(clone);
            const svgBlob = new Blob([svgStr], {
              type: "image/svg+xml;charset=utf-8",
            });
            const url = URL.createObjectURL(svgBlob);
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement("canvas");
              canvas.width = w * scale;
              canvas.height = h * scale;
              const ctx = canvas.getContext("2d");
              // Fill background
              ctx.fillStyle =
                computed.getPropertyValue("--av-surface").trim() || "#f5f0eb";
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(img, 0, 0);
              URL.revokeObjectURL(url);
              canvas.toBlob((blob) => {
                if (blob) resolve(blob);
                else reject(new Error("toBlob failed"));
              }, format || "image/png");
            };
            img.onerror = () => {
              URL.revokeObjectURL(url);
              reject(new Error("SVG load failed"));
            };
            img.src = url;
          });
        }

        // --- Canvas → Blob at N× via re-render hook ---
        function canvasToBlob(canvasEl, scale, format) {
          return new Promise((resolve, reject) => {
            // Check for exposed renderAtScale
            if (canvasEl.renderAtScale) {
              const tmpCanvas = document.createElement("canvas");
              tmpCanvas.width = canvasEl.width * scale;
              tmpCanvas.height = canvasEl.height * scale;
              const ctx = tmpCanvas.getContext("2d");
              ctx.scale(scale, scale);
              canvasEl.renderAtScale(ctx, scale);
              tmpCanvas.toBlob(
                (blob) =>
                  blob ? resolve(blob) : reject(new Error("toBlob failed")),
                format || "image/png",
              );
            } else {
              // Fallback: upscale existing canvas
              const tmpCanvas = document.createElement("canvas");
              tmpCanvas.width = canvasEl.width * scale;
              tmpCanvas.height = canvasEl.height * scale;
              const ctx = tmpCanvas.getContext("2d");
              ctx.imageSmoothingEnabled = true;
              ctx.imageSmoothingQuality = "high";
              ctx.drawImage(canvasEl, 0, 0, tmpCanvas.width, tmpCanvas.height);
              tmpCanvas.toBlob(
                (blob) =>
                  blob ? resolve(blob) : reject(new Error("toBlob failed")),
                format || "image/png",
              );
            }
          });
        }

        // --- Generic export: auto-detect SVG vs Canvas vs HTML ---
        async function exportBlob(target, scale, format) {
          scale = scale || SCALE_DEFAULT;
          if (target.tagName === "SVG") {
            return svgToBlob(target, scale, format);
          } else if (target.tagName === "CANVAS") {
            return canvasToBlob(target, scale, format);
          } else {
            // HTML fallback — screenshot via html2canvas if available, else canvas draw
            const w = target.scrollWidth || target.clientWidth || 800;
            const h = target.scrollHeight || target.clientHeight || 600;
            const canvas = document.createElement("canvas");
            canvas.width = w * scale;
            canvas.height = h * scale;
            const ctx = canvas.getContext("2d");
            ctx.scale(scale, scale);
            ctx.fillStyle =
              getComputedStyle(document.documentElement)
                .getPropertyValue("--av-surface")
                .trim() || "#f5f0eb";
            ctx.fillRect(0, 0, w, h);
            // Use foreignObject approach
            const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">
        <foreignObject width="100%" height="100%">
          <div xmlns="http://www.w3.org/1999/xhtml">${target.outerHTML}</div>
        </foreignObject>
      </svg>`;
            const blob = new Blob([svgStr], {
              type: "image/svg+xml;charset=utf-8",
            });
            const url = URL.createObjectURL(blob);
            return new Promise((resolve, reject) => {
              const img = new Image();
              img.onload = () => {
                ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);
                canvas.toBlob(
                  (b) => (b ? resolve(b) : reject(new Error("toBlob failed"))),
                  format || "image/png",
                );
              };
              img.onerror = () => {
                URL.revokeObjectURL(url);
                reject(
                  new Error("HTML export failed — use SVG or canvas target"),
                );
              };
              img.src = url;
            });
          }
        }

        // --- Download helper ---
        function download(blob, filename) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // --- Public API ---
        async function exportPNG(selector, scale) {
          const target = findTarget(selector);
          if (!target) {
            toast("No export target found");
            return;
          }
          try {
            const blob = await exportBlob(
              target,
              scale || SCALE_DEFAULT,
              "image/png",
            );
            download(blob, "archviz-" + Date.now() + ".png");
            toast("PNG exported (4× raster)");
          } catch (e) {
            toast("Export failed: " + e.message);
            console.error(e);
          }
        }

        async function exportWebP(selector, scale) {
          const target = findTarget(selector);
          if (!target) {
            toast("No export target found");
            return;
          }
          try {
            const blob = await exportBlob(
              target,
              scale || SCALE_DEFAULT,
              "image/webp",
            );
            download(blob, "archviz-" + Date.now() + ".webp");
            toast("WebP exported (4× raster)");
          } catch (e) {
            toast("Export failed: " + e.message);
            console.error(e);
          }
        }

        async function exportSVG(selector) {
          const target = findTarget(selector);
          if (!target || target.tagName !== "SVG") {
            toast("SVG export requires an SVG target");
            return;
          }
          try {
            const clone = target.cloneNode(true);
            const computed = getComputedStyle(document.documentElement);
            const vars = [
              "--av-surface",
              "--av-surface-alt",
              "--av-text-primary",
              "--av-text-secondary",
              "--av-text-tertiary",
              "--av-border",
              "--av-accent",
              "--av-chart-1",
              "--av-chart-2",
              "--av-chart-3",
              "--av-chart-4",
              "--av-chart-5",
              "--av-chart-6",
            ];
            let varCSS = ":root{";
            vars.forEach((v) => {
              varCSS += v + ":" + computed.getPropertyValue(v).trim() + ";";
            });
            varCSS += "}";
            let styleEl = clone.querySelector("style");
            if (!styleEl) {
              styleEl = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "style",
              );
              clone.insertBefore(styleEl, clone.firstChild);
            }
            styleEl.textContent = varCSS + styleEl.textContent;
            const svgStr = new XMLSerializer().serializeToString(clone);
            const blob = new Blob([svgStr], {
              type: "image/svg+xml;charset=utf-8",
            });
            download(blob, "archviz-" + Date.now() + ".svg");
            toast("SVG exported (with theme vars)");
          } catch (e) {
            toast("SVG export failed: " + e.message);
            console.error(e);
          }
        }

        async function copyToClipboard(selector) {
          const target = findTarget(selector);
          if (!target) {
            toast("No export target found");
            return;
          }
          try {
            const blob = await exportBlob(target, SCALE_DEFAULT, "image/png");
            if (navigator.clipboard && window.ClipboardItem) {
              await navigator.clipboard.write([
                new ClipboardItem({ "image/png": blob }),
              ]);
              toast("Copied to clipboard (4× PNG)");
            } else {
              // Fallback: data URL to console
              const reader = new FileReader();
              reader.onload = () => {
                console.log("Clipboard fallback — data URL:", reader.result);
              };
              reader.readAsDataURL(blob);
              toast("Clipboard unavailable — data URL logged to console");
            }
          } catch (e) {
            toast("Clipboard failed: " + e.message);
            console.error(e);
          }
        }

        // --- Menu UI ---
        function createMenu() {
          const btn = document.createElement("button");
          btn.id = "archviz-export-btn";
          btn.textContent = "Export";
          btn.addEventListener("click", toggleMenu);

          const menu = document.createElement("div");
          menu.id = "archviz-export-menu";
          menu.innerHTML = `
      <button data-action="png">Export PNG <span class="shortcut">E→P</span></button>
      <button data-action="svg">Export SVG <span class="shortcut">E→S</span></button>
      <button data-action="webp">Export WebP <span class="shortcut">E→W</span></button>
      <div class="sep"></div>
      <button data-action="clipboard">Copy to Clipboard <span class="shortcut">E→C</span></button>
    `;
          menu.addEventListener("click", (e) => {
            const action = e.target.closest("button")?.dataset?.action;
            if (!action) return;
            closeMenu();
            if (action === "png") exportPNG();
            else if (action === "svg") exportSVG();
            else if (action === "webp") exportWebP();
            else if (action === "clipboard") copyToClipboard();
          });

          document.body.appendChild(btn);
          document.body.appendChild(menu);
        }

        function toggleMenu() {
          const menu = document.getElementById("archviz-export-menu");
          if (menu) menu.classList.toggle("open");
        }
        function closeMenu() {
          const menu = document.getElementById("archviz-export-menu");
          if (menu) menu.classList.remove("open");
        }

        // --- Keyboard shortcuts ---
        let pendingE = false;
        let pendingETimer = null;

        document.addEventListener("keydown", (e) => {
          // Skip if typing in input
          if (
            e.target.tagName === "INPUT" ||
            e.target.tagName === "TEXTAREA" ||
            e.target.isContentEditable
          )
            return;
          // Skip if OrbitControls is active (3D pages)
          if (
            e.target.tagName === "CANVAS" &&
            document.querySelector("canvas[data-orbit]")
          )
            return;

          const key = e.key.toLowerCase();

          // T = cycle theme
          if (key === "t" && !e.metaKey && !e.ctrlKey && !e.altKey) {
            e.preventDefault();
            window.archvizTheme?.toggleTheme();
            return;
          }

          // E = export menu toggle (or E→P/S/W/C two-key combo)
          if (key === "e" && !e.metaKey && !e.ctrlKey && !e.altKey) {
            e.preventDefault();
            if (pendingE) {
              clearTimeout(pendingETimer);
              pendingE = false;
              return;
            }
            pendingE = true;
            toggleMenu();
            pendingETimer = setTimeout(() => {
              pendingE = false;
            }, 800);
            return;
          }

          // Two-key combos after E
          if (pendingE) {
            clearTimeout(pendingETimer);
            pendingE = false;
            closeMenu();
            if (key === "p") exportPNG();
            else if (key === "s") exportSVG();
            else if (key === "w") exportWebP();
            else if (key === "c") copyToClipboard();
            return;
          }

          // Escape = close menu
          if (key === "escape") closeMenu();
        });

        // Close menu on outside click
        document.addEventListener("click", (e) => {
          if (
            !e.target.closest("#archviz-export-menu") &&
            !e.target.closest("#archviz-export-btn")
          ) {
            closeMenu();
          }
        });

        // Expose API
        window.archvizExport = {
          exportPNG,
          exportSVG,
          exportWebP,
          copyToClipboard,
        };

        // Init
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", createMenu);
        } else {
          createMenu();
        }
      })();
    </script>
  </body>
</html>
