name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Verify Sync and Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Verify Dependencies Compatibility
      run: pip check

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # Step order is load-bearing and mirrors scripts/git-pre-commit.sh:
    #   check formatting -> sync modules -> reformat -> require zero diff
    #
    # Prettier re-indents the embedded <style>/<script> blocks that the sync
    # scripts paste in, so `sync` alone can never reproduce a committed
    # template. The previous order (sync -> git diff -> prettier --check) was
    # therefore unsatisfiable: it failed from 2026-06-28 onward, first on the
    # formatting check, then — once the pre-commit hook started formatting —
    # on the diff check. Do not reorder these steps.
    #
    # Prettier is pinned so a new release cannot silently change the expected
    # formatting. Bump it here and in scripts/git-pre-commit.sh together.
    - name: Verify Code Formatting with Prettier
      run: npx --yes prettier@3.9.9 --check "templates/html/*.html"

    - name: Run Sync Scripts
      run: |
        python scripts/sync_theme.py
        python scripts/sync_export.py

    - name: Format Synced Templates with Prettier
      run: npx --yes prettier@3.9.9 --write "templates/html/*.html"

    - name: Check for Uncommitted Sync Changes
      run: |
        git diff --exit-code || (echo "ERROR: Templates are out of sync with components. Run scripts/git-pre-commit.sh locally and commit the result!" && exit 1)

    # Placed after the sync/prettier block on purpose: that block's order is
    # load-bearing (see the comment above), and this check is independent of it.
    #
    # The palette registry is written down in four places — the template
    # (authoritative), engine.py, DESIGN.md, SKILL.md — and they drifted
    # silently: `blueprint` reached the template and DESIGN.md in v0.5.4 but
    # never engine.py, so `--palette blueprint` returned the document unchanged
    # with no error. Nothing could notice. Now something can.
    - name: Verify Palette Registry Consistency
      run: python3 scripts/check_palette_registry.py

    # Same class of problem as the palette registry: one fact written down in
    # several places, drifting silently. The kit owns version / byte budget /
    # routing surface / count claims / reference reachability / declared imports
    # / compilation / CJK encoding — run `python3 scripts/check_archviz.py
    # --list` for the current set rather than trusting this comment, which has
    # drifted twice. One file, one `archviz-checks.json` per repo, so the
    # family's other four repos carry the same kit with their own config
    # instead of five hand-synced copies.
    #
    # Version drift this catches: pyproject.toml had fallen 4 releases behind
    # and publish-skill.py hardcoded 0.2.5, so `gh release create` would have
    # tagged a version the skill never shipped. SKILL.md is the truth.
    - name: Verify Consistency Kit
      run: python3 scripts/check_archviz.py

    # A checker is only a gate if its own failure modes are tested. This runs
    # the adversarial fixtures: every check is exercised in both polarities,
    # including the cases that must NOT fire (a semver in a docstring, a name
    # satisfied by an alias, a charset exemption carrying a reason).
    - name: Verify Consistency Kit Checker
      run: python3 scripts/check_archviz.py --self-test
